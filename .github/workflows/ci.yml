name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle.lockfile
            gradle/wrapper/gradle-wrapper.properties

      - name: Build and run all tests
        id: build
        # Invoke through bash because gradlew is not tracked as executable.
        run: bash ./gradlew --no-daemon --console=plain clean build

      - name: Verify regression tests executed
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -LiteralPath 'build/test-results/test' -Filter 'TEST-*.xml' -ErrorAction Stop)
          if ($reports.Count -eq 0) { throw 'No JUnit XML reports found; tests must execute.' }
          $executed = 0
          $failures = 0
          $active = @()
          foreach ($report in $reports) {
            $suite = ([xml](Get-Content -Raw -LiteralPath $report.FullName)).testsuite
            $count = [int]$suite.tests - [int]$suite.skipped
            $executed += $count
            $failures += [int]$suite.failures + [int]$suite.errors
            if ($count -gt 0) { $active += [string]$suite.name }
          }
          $required = @(
            'com.autoauth.jwt.JwtTokenTest',
            'com.autoauth.config.AutoAuthConfigurationTest',
            'com.autoauth.config.CookieRecoveryTest',
            'com.autoauth.config.ServletDispatchSecurityTest',
            'com.autoauth.config.CustomSwaggerPathsTest',
            'com.autoauth.config.PrivateSwaggerPathsTest',
            'com.autoauth.config.BearerSwaggerCustomizationTest',
            'com.autoauth.config.JsonCompatibilityTest',
            'com.autoauth.config.SwaggerConsumerTest'
          )
          $missing = @($required | Where-Object { $_ -notin $active })
          if ($missing.Count -gt 0) { throw "Required regression suites did not execute: $($missing -join ', ')" }
          if ($executed -le 0 -or $failures -ne 0) {
            throw "Invalid test results: $executed executed, $failures failures/errors."
          }
          Write-Output "Verified $executed executed tests with no failures/errors, including JWT, HTTP/CSRF, and Swagger."

      - name: Set up Python for publication verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify published Gradle and Maven consumers
        run: python scripts/verify-publication.py

      - name: Upload failure reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-failure-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/TEST-*.xml
            build/reports/publication/
          if-no-files-found: warn
          retention-days: 7
