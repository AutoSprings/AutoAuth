version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns:
          - 'org.springframework.boot:*'
      jjwt:
        patterns:
          - 'io.jsonwebtoken:*'
      jackson:
        patterns:
          - 'com.fasterxml.jackson:*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Etc/UTC
    groups:
      actions:
        patterns:
          - '*'
