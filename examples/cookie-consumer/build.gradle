plugins { id 'application' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories {
    if (providers.gradleProperty('autoauthRepository').isPresent()) {
        maven { url = uri(providers.gradleProperty('autoauthRepository').get()) }
    }
    mavenCentral()
}
dependencies {
    implementation "${providers.gradleProperty('autoauthGroup').getOrElse('io.github.autosprings')}:autoauth:${providers.gradleProperty('autoauthVersion').getOrElse('1.0.0')}"
}
application { mainClass = 'demo.DemoApplication' }
